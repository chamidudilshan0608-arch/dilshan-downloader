<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DILSHAN MEDIA DOWNLOADER</title>
    
    <!-- Logo & Favicon Links -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    
    <!-- Meta & SEO Tags -->
    <meta name="description" content="Download TikTok & Media videos in 1080p Full HD, 720p HD without watermark & MP3 audio for free with Dilshan Media Downloader.">
    <meta property="og:title" content="DILSHAN MEDIA DOWNLOADER">
    <meta property="og:description" content="Free 1080p, 720p Video & Audio Downloader">
    <meta property="og:image" content="/logo.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .logo-img {
            width: 85px;
            height: 85px;
            border-radius: 18px;
            margin-bottom: 15px;
            object-fit: cover;
        }
        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #00f2fe;
        }
        button.btn-search {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1f6feb, #00f2fe);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button.btn-search:hover {
            opacity: 0.9;
        }
        #loading {
            display: none;
            margin: 20px 0;
            color: #58a6ff;
            font-size: 14px;
        }
        #result {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
            text-align: left;
        }
        .cover-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .video-title {
            font-size: 14px;
            color: #e6edf3;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .section-label {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 10px;
        }
        .download-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .dl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border: none;
            width: 100%;
            transition: opacity 0.2s;
        }
        .dl-1080 { background-color: #238636; } /* Green */
        .dl-720 { background-color: #1f6feb; }  /* Blue */
        .dl-wm { background-color: #d97706; }   /* Orange */
        .dl-mp3 { background-color: #8957e5; }  /* Purple */
        
        .dl-btn:hover { opacity: 0.85; }
        
        .error-msg {
            color: #f85149;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #8b949e;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Site Logo -->
        <img src="/logo.png" alt="DILSHAN MEDIA DOWNLOADER Logo" class="logo-img" onerror="this.style.display='none'">
        
        <!-- Header -->
        <h1>DILSHAN MEDIA DOWNLOADER</h1>
        <p class="subtitle">Download TikTok & Social Media Videos in 1080p, 720p & MP3</p>

        <!-- Input Box & Button -->
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste Video Link Here...">
            <button class="btn-search" onclick="fetchVideo()">Download Now</button>
        </div>

        <!-- Error Alert -->
        <div id="errorMsg" class="error-msg"></div>

        <!-- Loading Indicator -->
        <div id="loading">Processing... Please wait...</div>

        <!-- Download Results Container -->
        <div id="result">
            <img id="coverImg" class="cover-img" src="" alt="Video Thumbnail">
            <div id="videoTitle" class="video-title"></div>

            <div class="section-label">Select Quality to Download:</div>
            <div class="download-options">
                <button id="dl1080" class="dl-btn dl-1080">Download 1080p Full HD (No Watermark)</button>
                <button id="dl720" class="dl-btn dl-720">Download 720p HD (No Watermark)</button>
                <button id="dlWm" class="dl-btn dl-wm">Download Watermark Video</button>
                <button id="dlMp3" class="dl-btn dl-mp3">Download Audio (MP3)</button>
            </div>
        </div>

        <footer>
            &copy; DILSHAN MEDIA DOWNLOADER - All Rights Reserved.
        </footer>
    </div>

    <script>
        let mediaLinks = {};

        async function fetchVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';
            result.style.display = 'none';

            if (!urlInput) {
                errorMsg.innerText = "Please paste a valid video URL!";
                errorMsg.style.display = 'block';
                return;
            }

            loading.innerText = "Processing... Please wait...";
            loading.style.display = 'block';

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}&hd=1`);
                const data = await response.json();

                loading.style.display = 'none';

                if (data && data.data) {
                    document.getElementById('coverImg').src = data.data.cover;
                    document.getElementById('videoTitle').innerText = data.data.title || "Video";
                    
                    mediaLinks = {
                        hd1080: data.data.hdplay || data.data.play,
                        sd720: data.data.play,
                        wm: data.data.wmplay || data.data.play,
                        mp3: data.data.music,
                        title: data.data.title ? data.data.title.replace(/[^a-zA-Z0-9]/g, "_").substring(0, 25) : "video"
                    };

                    document.getElementById('dl1080').onclick = () => downloadFile(mediaLinks.hd1080, `${mediaLinks.title}_1080p.mp4`);
                    document.getElementById('dl720').onclick = () => downloadFile(mediaLinks.sd720, `${mediaLinks.title}_720p.mp4`);
                    document.getElementById('dlWm').onclick = () => downloadFile(mediaLinks.wm, `${mediaLinks.title}_watermark.mp4`);
                    document.getElementById('dlMp3').onclick = () => downloadFile(mediaLinks.mp3, `${mediaLinks.title}.mp3`);

                    result.style.display = 'block';
                } else {
                    errorMsg.innerText = "Failed to fetch video. Please check the link!";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                loading.style.display = 'none';
                errorMsg.innerText = "An error occurred while downloading!";
                errorMsg.style.display = 'block';
            }
        }

        // Direct Download Function without opening new tab
        async function downloadFile(fileUrl, fileName) {
            if (!fileUrl) return;

            const loading = document.getElementById('loading');
            loading.innerText = "Downloading file directly to your device...";
            loading.style.display = 'block';

            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();

                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                // Fallback
                const link = document.createElement('a');
                link.href = fileUrl;
                link.download = fileName;
                link.target = '_self';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
