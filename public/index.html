<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DILSHAN TIKTOK DOWNLOADER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 480px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); text-align: center; }
        h1 { color: #58a6ff; font-size: 22px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { font-size: 13px; color: #8b949e; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background-color: #0d1117; color: #ffffff; font-size: 14px; outline: none; }
        input[type="text"]:focus { border-color: #58a6ff; }
        button.btn-search { width: 100%; padding: 14px; border-radius: 8px; border: none; background: linear-gradient(135deg, #1f6feb, #238636); color: white; font-size: 15px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button.btn-search:hover { opacity: 0.9; }
        #loading { display: none; margin: 15px 0; color: #58a6ff; font-size: 14px; }
        #result { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #30363d; text-align: left; }
        .cover-img { width: 100%; border-radius: 10px; margin-bottom: 12px; max-height: 250px; object-fit: cover; }
        .video-title { font-size: 14px; font-weight: 600; margin-bottom: 15px; color: #f0f6fc; line-height: 1.4; }
        
        .section-label { font-size: 13px; color: #8b949e; margin-top: 12px; margin-bottom: 8px; font-weight: bold; display: block; border-bottom: 1px solid #21262d; padding-bottom: 4px; }
        .download-options { display: flex; flex-direction: column; gap: 10px; }
        .dl-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; color: white; text-align: center; }
        .dl-1080 { background-color: #238636; }
        .dl-720 { background-color: #1f6feb; }
        .dl-mp3 { background-color: #8957e5; }
        .dl-btn:hover { opacity: 0.85; }
        .error-msg { color: #f85149; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>DILSHAN TIKTOK DOWNLOADER</h1>
    <p class="subtitle">Download TikTok Videos in HD Quality & MP3</p>
    
    <div class="input-group">
        <input type="text" id="tiktokUrl" placeholder="TikTok Video Link එක Paste කරන්න...">
        <button class="btn-search" onclick="fetchTikTok()">Video එක සොයන්න</button>
    </div>
    
    <div id="loading">දත්ත ලබාගනිමින් පවතී...</div>
    <div id="errorMsg" class="error-msg"></div>
    
    <div id="result">
        <img id="coverImg" class="cover-img" src="" alt="Cover">
        <div id="videoTitle" class="video-title"></div>
        
        <!-- Video Section -->
        <span class="section-label">🎬 Video Quality එක තෝරන්න:</span>
        <div class="download-options">
            <a id="btn1080" class="dl-btn dl-1080" href="#" target="_blank">✨ 1080p Full HD (No Watermark)</a>
            <a id="btn720" class="dl-btn dl-720" href="#" target="_blank">📹 720p Normal HD (No Watermark)</a>
        </div>
        
        <!-- Audio Section -->
        <span class="section-label" id="audioLabel">🎵 Audio (සංගීතය පමණක්):</span>
        <div class="download-options">
            <a id="btnMP3" class="dl-btn dl-mp3" href="#" target="_blank">🎧 MP3 Download</a>
        </div>
    </div>
</div>

<script>
    async function fetchTikTok() {
        const urlInput = document.getElementById('tiktokUrl').value.trim();
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('errorMsg');
        const result = document.getElementById('result');
        
        errorMsg.innerText = '';
        result.style.display = 'none';
        
        if (!urlInput) { 
            errorMsg.innerText = 'කරුණාකර TikTok Link එකක් ඇතුළත් කරන්න.'; 
            return; 
        }
        
        loading.style.display = 'block';
        
        try {
            const res = await fetch('/api/tiktok', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });
            
            const data = await res.json();
            loading.style.display = 'none';
            
            if (data.success) {
                const info = data.data;
                document.getElementById('coverImg').src = info.cover;
                document.getElementById('videoTitle').innerText = info.title + " (@" + info.author + ")";
                
                const btn1080 = document.getElementById('btn1080');
                const btn720 = document.getElementById('btn720');
                const btnMP3 = document.getElementById('btnMP3');
                const audioLabel = document.getElementById('audioLabel');
                
                // 1080p HD
                if (info.video_hd) { 
                    btn1080.href = info.video_hd; 
                    btn1080.style.display = 'flex'; 
                } else { 
                    btn1080.style.display = 'none'; 
                }
                
                // 720p Normal
                if (info.video_sd) { 
                    btn720.href = info.video_sd; 
                    btn720.style.display = 'flex'; 
                } else { 
                    btn720.style.display = 'none'; 
                }
                
                // MP3 Audio
                if (info.audio) { 
                    btnMP3.href = info.audio; 
                    btnMP3.style.display = 'flex'; 
                    audioLabel.style.display = 'block';
                } else { 
                    btnMP3.style.display = 'none'; 
                    audioLabel.style.display = 'none';
                }
                
                result.style.display = 'block';
            } else { 
                errorMsg.innerText = data.message || 'දත්ත ලබාගැනීමට නොහැකි විය.'; 
            }
        } catch (e) {
            loading.style.display = 'none';
            errorMsg.innerText = 'Server එකට සම්බන්ධ වීමට නොහැකි විය.';
        }
    }
</script>
</body>
</html>
