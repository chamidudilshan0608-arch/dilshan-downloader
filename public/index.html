<head>
    <!-- Google tag (gtag.js) - Analytics -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Search Engine වලට නොපෙනී තැබීමට (Direct Link එකෙන් පමණක් යාමට) -->
    <meta name="robots" content="noindex, nofollow">
    <title>TIKTOK DOWNLOADER - Private</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="/manifest.json">

    <!-- Logo & Favicon Links -->
    <link rel="icon" type="image/png" href="/icon-512.png">
    <link rel="apple-touch-icon" href="/icon-512.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #06090e;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Password Modal Styling */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #06090e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            width: 100%;
            max-width: 380px;
            background-color: #0d131f;
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.5);
        }
        .login-box h2 {
            color: #00f2fe;
            margin-bottom: 10px;
            font-size: 20px;
        }
        .login-box p {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 15px;
            background-color: #06090e;
            border: 1px solid #1f293d;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0052d4, #4364f7);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 580px;
            background-color: #0d131f;
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 20px;
            padding: 32px 25px;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.12);
            text-align: center;
            display: none; /* Login වන තුරු සඟවා තබයි */
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .brand-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-small {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(0, 242, 254, 0.4);
        }
        .brand-name {
            font-weight: bold;
            color: #00f2fe;
            font-size: 16px;
        }
        .install-btn {
            display: none;
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.4);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            align-items: center;
            gap: 6px;
        }
        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 22px;
            margin-bottom: 18px;
            object-fit: cover;
            border: 2px solid rgba(0, 242, 254, 0.4);
        }
        h1 {
            color: #00f2fe;
            font-size: 26px;
            margin-bottom: 6px;
            font-weight: 800;
        }
        .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px 18px;
            background-color: #06090e;
            border: 1px solid #1f293d;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }
        button.btn-search {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #loading {
            display: none;
            margin: 20px 0;
            color: #00f2fe;
            font-size: 14px;
        }
        #result {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #1f293d;
            text-align: left;
        }
        .cover-img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .video-title {
            font-size: 14px;
            color: #e6edf3;
            margin-bottom: 15px;
        }
        .download-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .dl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 13px;
            border-radius: 10px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .dl-1080 { background-color: #10b981; }
        .dl-720 { background-color: #2563eb; }
        .dl-wm { background-color: #d97706; }
        .dl-mp3 { background-color: #7c3aed; }
        
        .error-msg {
            color: #f85149;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        
        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #8b949e;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Password Overlay -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔒 Private Downloader</h2>
            <p>Please enter password to access</p>
            <input type="password" id="passInput" placeholder="Enter Password">
            <button onclick="checkPassword()">Unlock</button>
            <p id="passError" style="color: #f85149; margin-top: 10px; display: none;">Wrong password!</p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container" id="mainContainer">
        <div class="top-bar">
            <div class="brand-info">
                <img src="/icon-512.png" alt="Logo" class="logo-small" onerror="this.style.display='none'">
                <span class="brand-name">TikTok DL</span>
            </div>
            <button id="installBtn" class="install-btn" onclick="installApp()">
                📱 Install App
            </button>
        </div>

        <img src="/icon-512.png" alt="TikTok Downloader Logo" class="logo-img" onerror="this.style.display='none'">
        
        <h1>TIKTOK DOWNLOADER</h1>
        <p class="subtitle">Download TikTok Videos in 1080p, 720p & MP3 Without Watermark</p>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste TikTok Link Here...">
            <button class="btn-search" onclick="fetchVideo()">Download Now</button>
        </div>

        <div id="errorMsg" class="error-msg"></div>
        <div id="loading">Processing... Please wait...</div>

        <div id="result">
            <img id="coverImg" class="cover-img" src="" alt="Video Thumbnail">
            <div id="videoTitle" class="video-title"></div>

            <div style="font-size: 13px; color: #8b949e; margin-bottom: 12px;">Select Quality to Download:</div>
            <div class="download-options" id="downloadButtons"></div>
        </div>

        <footer>
            © Powered by Dilshan
        </footer>
    </div>

    <script>
        // Password Logic (ටොකන් එක / පාස්වර්ඩ් එක මෙහි සකසා ඇත)
        const SECRET_PASS = "#dilshan6767#";

        if (sessionStorage.getItem("isUnlocked") === "true") {
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("mainContainer").style.display = "block";
        }

        function checkPassword() {
            const input = document.getElementById("passInput").value;
            const error = document.getElementById("passError");

            if (input === SECRET_PASS) {
                sessionStorage.setItem("isUnlocked", "true");
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("mainContainer").style.display = "block";
            } else {
                error.style.display = "block";
            }
        }

        // PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('installBtn');
            if (installBtn) installBtn.style.display = 'inline-flex';
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                    document.getElementById('installBtn').style.display = 'none';
                });
            }
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
            });
        }

        async function fetchVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const errorMsg = document.getElementById('errorMsg');
            const downloadButtons = document.getElementById('downloadButtons');

            errorMsg.style.display = 'none';
            result.style.display = 'none';
            downloadButtons.innerHTML = '';

            if (!urlInput) {
                showError("Please paste a valid TikTok video URL!");
                return;
            }

            loading.innerText = "Processing link... Please wait...";
            loading.style.display = 'block';

            await fetchTikTokVideo(urlInput);
        }

        async function fetchTikTokVideo(urlInput) {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const downloadButtons = document.getElementById('downloadButtons');

            try {
                const response = `https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}&hd=1`;
                const apiRes = await fetch(response);
                const data = await apiRes.json();

                loading.style.display = 'none';

                if (data && data.data) {
                    document.getElementById('coverImg').src = data.data.cover;
                    document.getElementById('videoTitle').innerText = data.data.title || "TikTok Video";
                    
                    const titleClean = data.data.title ? data.data.title.replace(/[^a-zA-Z0-9]/g, "_").substring(0, 25) : "tiktok_video";
                    
                    downloadButtons.innerHTML = `
                        <button class="dl-btn dl-1080" onclick="downloadFile('${data.data.hdplay || data.data.play}', '${titleClean}_1080p.mp4')">Download 1080p Full HD (No Watermark)</button>
                        <button class="dl-btn dl-720" onclick="downloadFile('${data.data.play}', '${titleClean}_720p.mp4')">Download 720p HD (No Watermark)</button>
                        <button class="dl-btn dl-wm" onclick="downloadFile('${data.data.wmplay || data.data.play}', '${titleClean}_watermark.mp4')">Download Watermark Video</button>
                        <button class="dl-btn dl-mp3" onclick="downloadFile('${data.data.music}', '${titleClean}.mp3')">Download Audio (MP3)</button>
                    `;

                    result.style.display = 'block';
                } else {
                    showError("Failed to fetch TikTok video. Please check the link!");
                }
            } catch (err) {
                loading.style.display = 'none';
                showError("Error connecting to TikTok API!");
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
        }

        async function downloadFile(fileUrl, fileName) {
            if (!fileUrl) return;

            const loading = document.getElementById('loading');
            loading.innerText = "Downloading file directly to your device...";
            loading.style.display = 'block';

            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();

                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                const link = document.createElement('a');
                link.href = fileUrl;
                link.download = fileName;
                link.target = '_self';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
