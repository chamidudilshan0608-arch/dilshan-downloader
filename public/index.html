<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok & YouTube Downloader</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#fe2c55">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZDJ7CCZVK5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZDJ7CCZVK5');
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #1e1e1e; padding: 30px; border-radius: 16px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); margin-top: 20px; }
    .logo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 2px solid #fe2c55; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
    p.subtitle { font-size: 13px; color: #aaa; margin-bottom: 20px; }
    
    .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    input[type="text"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; outline: none; }
    input[type="text"]:focus { border-color: #fe2c55; }
    
    .btn { background: linear-gradient(45deg, #fe2c55, #25f4ee); border: none; padding: 14px; color: #fff; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .btn:hover { opacity: 0.9; }
    
    #result { margin-top: 20px; text-align: left; }
    .video-thumb { width: 100%; border-radius: 8px; margin-bottom: 12px; }
    .download-btns { display: flex; flex-direction: column; gap: 8px; }
    .dl-link { display: block; text-align: center; background: #25f4ee; color: #000; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: bold; }
    .dl-link.mp3 { background: #fe2c55; color: #fff; }

    #installContainer { margin-bottom: 15px; display: none; }
    .install-btn { background: #25f4ee; color: #111; padding: 10px 16px; border-radius: 20px; font-weight: bold; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <div id="installContainer">
    <button id="installBtn" class="install-btn">📲 Install App</button>
  </div>

  <div class="container">
    <img src="/New logo.jpg" alt="Logo" class="logo" onerror="this.src='https://via.placeholder.com/80'">
    <h1>Media Downloader</h1>
    <p class="subtitle">Download TikTok & YouTube Videos easily</p>

    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Paste TikTok or YouTube Link here...">
      <button class="btn" onclick="processDownload()">Download Now</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    // PWA Install Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installContainer').style.display = 'block';
    });

    document.getElementById('installBtn')?.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          document.getElementById('installContainer').style.display = 'none';
        });
      }
    });

    // Download Logic for TikTok & YouTube
    async function processDownload() {
      const url = document.getElementById('urlInput').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!url) {
        alert("Please paste a URL first!");
        return;
      }

      resultDiv.innerHTML = "<p style='text-align:center; color:#aaa;'>Processing...</p>";

      // Check if YouTube
      if (url.includes("youtube.com") || url.includes("youtu.be")) {
        fetchYouTube(url);
      } else {
        // Default to TikTok
        fetchTikTok(url);
      }
    }

    // TikTok Downloader (TikWM API)
    async function fetchTikTok(url) {
      const resultDiv = document.getElementById('result');
      try {
        const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data.code === 0) {
          resultDiv.innerHTML = `
            <img src="${data.data.cover}" class="video-thumb">
            <p style="margin-bottom:10px; font-size:14px;"><strong>${data.data.title || 'TikTok Video'}</strong></p>
            <div class="download-btns">
              <a href="${data.data.play}" class="dl-link" target="_blank" download>Download Video (No Watermark)</a>
              <a href="${data.data.music}" class="dl-link mp3" target="_blank" download>Download Audio (MP3)</a>
            </div>
          `;
        } else {
          resultDiv.innerHTML = "<p style='color:#fe2c55; text-align:center;'>Unable to fetch TikTok video. Check link!</p>";
        }
      } catch (err) {
        resultDiv.innerHTML = "<p style='color:#fe2c55; text-align:center;'>Error loading video.</p>";
      }
    }

    // YouTube Downloader (Through Server Proxy with proper response handling)
    async function fetchYouTube(url) {
      const resultDiv = document.getElementById('result');
      try {
        const response = await fetch('/api/youtube', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        const videoUrl = data.url || (data.picker && data.picker[0] && data.picker[0].url);

        if (videoUrl) {
          resultDiv.innerHTML = `
            <p style="margin-bottom:10px; font-size:14px;"><strong>YouTube Video Ready!</strong></p>
            <div class="download-btns">
              <a href="${videoUrl}" class="dl-link" target="_blank" download>Download Video</a>
            </div>
          `;
        } else {
          resultDiv.innerHTML = "<p style='color:#fe2c55; text-align:center;'>Unable to fetch YouTube video. Try another link.</p>";
        }
      } catch (err) {
        resultDiv.innerHTML = "<p style='color:#fe2c55; text-align:center;'>Error connecting to YouTube API.</p>";
      }
    }
  </script>
</body>
</html>
