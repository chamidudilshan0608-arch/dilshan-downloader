<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIKTOK DOWNLOADER - Free HD Video & Audio Downloader</title>
    
    <!-- Logo & Favicon Links -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    
    <!-- Meta & SEO Tags -->
    <meta name="description" content="TikTok Downloader - Download TikTok videos without watermark in 1080p Full HD, 720p HD quality & MP3 audio for free.">
    <meta name="keywords" content="TikTok Downloader, TikTok Video Downloader, Download TikTok MP3, TikTok No Watermark">
    <meta property="og:title" content="TIKTOK DOWNLOADER">
    <meta property="og:description" content="Free 1080p, 720p TikTok Video & MP3 Downloader">
    <meta property="og:image" content="/logo.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #06090e; /* Deep Black/Dark Navy */
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 580px;
            background-color: #0d131f; /* Sleek Dark Card */
            border: 1px solid rgba(0, 242, 254, 0.25); /* Subtle Neon Blue Border */
            border-radius: 20px;
            padding: 32px 25px;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.12); /* Soft Cyan Glow */
            text-align: center;
        }
        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 22px;
            margin-bottom: 18px;
            object-fit: cover;
            border: 2px solid rgba(0, 242, 254, 0.4);
        }
        h1 {
            color: #00f2fe; /* Vibrant Blue */
            font-size: 26px;
            margin-bottom: 6px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }
        .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px 18px;
            background-color: #06090e;
            border: 1px solid #1f293d;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
        }
        button.btn-search {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.3);
        }
        button.btn-search:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        #loading {
            display: none;
            margin: 20px 0;
            color: #00f2fe;
            font-size: 14px;
        }
        #result {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #1f293d;
            text-align: left;
        }
        .cover-img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #1f293d;
        }
        .video-title {
            font-size: 14px;
            color: #e6edf3;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .section-label {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 12px;
        }
        .download-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .dl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 13px;
            border-radius: 10px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            width: 100%;
            transition: opacity 0.2s, transform 0.2s;
        }
        .dl-1080 { background-color: #10b981; } /* Emerald Green */
        .dl-720 { background-color: #2563eb; }  /* Royal Blue */
        .dl-wm { background-color: #d97706; }   /* Amber */
        .dl-mp3 { background-color: #7c3aed; }  /* Purple */
        
        .dl-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        
        .error-msg {
            color: #f85149;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        
        /* Normal Clean Footer Style */
        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #8b949e;
            text-align: center;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Site Logo -->
        <img src="/logo.png" alt="TIKTOK DOWNLOADER Logo" class="logo-img" onerror="this.style.display='none'">
        
        <!-- Header -->
        <h1>TIKTOK DOWNLOADER</h1>
        <p class="subtitle">Download TikTok Videos without Watermark in 1080p, 720p & MP3</p>

        <!-- Input Box & Button -->
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste TikTok Link Here...">
            <button class="btn-search" onclick="fetchVideo()">Download Now</button>
        </div>

        <!-- Error Alert -->
        <div id="errorMsg" class="error-msg"></div>

        <!-- Loading Indicator -->
        <div id="loading">Processing... Please wait...</div>

        <!-- Download Results Container -->
        <div id="result">
            <img id="coverImg" class="cover-img" src="" alt="Video Thumbnail">
            <div id="videoTitle" class="video-title"></div>

            <div class="section-label">Select Quality to Download:</div>
            <div class="download-options">
                <button id="dl1080" class="dl-btn dl-1080">Download 1080p Full HD (No Watermark)</button>
                <button id="dl720" class="dl-btn dl-720">Download 720p HD (No Watermark)</button>
                <button id="dlWm" class="dl-btn dl-wm">Download Watermark Video</button>
                <button id="dlMp3" class="dl-btn dl-mp3">Download Audio (MP3)</button>
            </div>
        </div>

        <!-- Normal Footer -->
        <footer>
            © Powered by Dilshan
        </footer>
    </div>

    <script>
        let mediaLinks = {};

        async function fetchVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';
            result.style.display = 'none';

            if (!urlInput) {
                errorMsg.innerText = "Please paste a valid video URL!";
                errorMsg.style.display = 'block';
                return;
            }

            loading.innerText = "Processing... Please wait...";
            loading.style.display = 'block';

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}&hd=1`);
                const data = await response.json();

                loading.style.display = 'none';

                if (data && data.data) {
                    document.getElementById('coverImg').src = data.data.cover;
                    document.getElementById('videoTitle').innerText = data.data.title || "TikTok Video";
                    
                    mediaLinks = {
                        hd1080: data.data.hdplay || data.data.play,
                        sd720: data.data.play,
                        wm: data.data.wmplay || data.data.play,
                        mp3: data.data.music,
                        title: data.data.title ? data.data.title.replace(/[^a-zA-Z0-9]/g, "_").substring(0, 25) : "tiktok_video"
                    };

                    document.getElementById('dl1080').onclick = () => downloadFile(mediaLinks.hd1080, `${mediaLinks.title}_1080p.mp4`);
                    document.getElementById('dl720').onclick = () => downloadFile(mediaLinks.sd720, `${mediaLinks.title}_720p.mp4`);
                    document.getElementById('dlWm').onclick = () => downloadFile(mediaLinks.wm, `${mediaLinks.title}_watermark.mp4`);
                    document.getElementById('dlMp3').onclick = () => downloadFile(mediaLinks.mp3, `${mediaLinks.title}.mp3`);

                    result.style.display = 'block';
                } else {
                    errorMsg.innerText = "Failed to fetch video. Please check the link!";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                loading.style.display = 'none';
                errorMsg.innerText = "An error occurred while downloading!";
                errorMsg.style.display = 'block';
            }
        }

        // Direct Download Function without opening new tab
        async function downloadFile(fileUrl, fileName) {
            if (!fileUrl) return;

            const loading = document.getElementById('loading');
            loading.innerText = "Downloading file directly to your device...";
            loading.style.display = 'block';

            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();

                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                const link = document.createElement('a');
                link.href = fileUrl;
                link.download = fileName;
                link.target = '_self';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
