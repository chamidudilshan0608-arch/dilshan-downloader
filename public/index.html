    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #06090e;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            display: flex;
            justify-content: center;

        }
        .container {
            width: 100%;

            background-color: #0d131f;
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 20px;

            box-shadow: 0 0 35px rgba(0, 242, 254, 0.12);

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 22px;
            margin-bottom: 18px;
            object-fit: cover;
            border: 2px solid rgba(0, 242, 254, 0.4);

        h1 {
            color: #00f2fe;
            font-size: 26px;
            margin-bottom: 6px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }
        .subtitle {
            font-size: 13px;

            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px 18px;
            background-color: #06090e;
            border: 1px solid #1f293d;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
        }
        button.btn-search {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            color: #ffffff;
            border: none;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.3);
        }
        button.btn-search:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        #loading {
            display: none;
            margin: 20px 0;
            color: #00f2fe;
            font-size: 14px;
        }
        #result {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #1f293d;

        }
        .cover-img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #1f293d;

        .video-title {
            font-size: 14px;
            color: #e6edf3;

        .section-label {

        }
        .dl-btn {
            display: flex;

            border-radius: 10px;

            cursor: pointer;
            border: none;
            width: 100%;
            transition: opacity 0.2s, transform 0.2s;
        }
        .dl-1080 { background-color: #10b981; }
        .dl-720 { background-color: #2563eb; }
        .dl-wm { background-color: #d97706; }
        .dl-mp3 { background-color: #7c3aed; }
        
        .dl-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        
        .error-msg {
            color: #f85149;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        
        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #8b949e;
            text-align: center;
            font-weight: normal;
        }

</head>
<body>

    <div class="container">
        <!-- Site Logo -->
        <img src="/New%20logo.jpg" alt="MEDIA DOWNLOADER Logo" class="logo-img" onerror="this.style.display='none'">
        
        <!-- Header -->
        <h1>MEDIA DOWNLOADER</h1>
        <p class="subtitle">Download TikTok & YouTube Videos in 1080p, 720p & MP3</p>

        <!-- Input Box & Button -->
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste TikTok or YouTube Link Here...">
            <button class="btn-search" onclick="fetchVideo()">Download Now</button>
        </div>

        <!-- Error Alert -->
        <div id="errorMsg" class="error-msg"></div>

        <!-- Loading Indicator -->
        <div id="loading">Processing... Please wait...</div>

        <!-- Download Results Container -->
        <div id="result">
            <img id="coverImg" class="cover-img" src="" alt="Video Thumbnail">
            <div id="videoTitle" class="video-title"></div>

            <div class="section-label">Select Quality to Download:</div>
            <div class="download-options" id="downloadButtons">
                <!-- Dynamic Buttons will be inserted here -->
            </div>
        </div>

        <!-- Footer -->
        <footer>
            © Powered by Dilshan
        </footer>
    </div>

    <script>
        // EMBEDDED ASITHA.TOP CREDENTIALS
        const ASITHA_API_KEY = "8872ddf50fc62bf1dc169a7a9deb12d118acc75d03fc82d220a0d3afe2c0d468";
        const ASITHA_ENDPOINT = "https://back.asitha.top/api/ytapi";

        async function fetchVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const errorMsg = document.getElementById('errorMsg');
            const downloadButtons = document.getElementById('downloadButtons');

            errorMsg.style.display = 'none';
            result.style.display = 'none';
            downloadButtons.innerHTML = '';

            if (!urlInput) {
                showError("Please paste a valid video URL!");
                return;
            }

            loading.innerText = "Processing link... Please wait...";
            loading.style.display = 'block';

            if (urlInput.includes("youtube.com") || urlInput.includes("youtu.be")) {
                await fetchYouTubeVideo(urlInput);
            } else {
                await fetchTikTokVideo(urlInput);
            }
        }

        // TikTok API Handler
        async function fetchTikTokVideo(urlInput) {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const downloadButtons = document.getElementById('downloadButtons');

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}&hd=1`);
                const data = await response.json();

                loading.style.display = 'none';

                if (data && data.data) {
                    document.getElementById('coverImg').src = data.data.cover;
                    document.getElementById('videoTitle').innerText = data.data.title || "TikTok Video";
                    
                    const titleClean = data.data.title ? data.data.title.replace(/[^a-zA-Z0-9]/g, "_").substring(0, 25) : "tiktok_video";
                    
                    downloadButtons.innerHTML = `
                        <button class="dl-btn dl-1080" onclick="downloadFile('${data.data.hdplay || data.data.play}', '${titleClean}_1080p.mp4')">Download 1080p Full HD (No Watermark)</button>
                        <button class="dl-btn dl-720" onclick="downloadFile('${data.data.play}', '${titleClean}_720p.mp4')">Download 720p HD (No Watermark)</button>
                        <button class="dl-btn dl-wm" onclick="downloadFile('${data.data.wmplay || data.data.play}', '${titleClean}_watermark.mp4')">Download Watermark Video</button>
                        <button class="dl-btn dl-mp3" onclick="downloadFile('${data.data.music}', '${titleClean}.mp3')">Download Audio (MP3)</button>
                    `;

                    result.style.display = 'block';
                } else {
                    showError("Failed to fetch TikTok video. Please check the link!");
                }
            } catch (err) {
                loading.style.display = 'none';
                showError("Error connecting to TikTok API!");
            }
        }

        // YouTube API Handler
        async function fetchYouTubeVideo(urlInput) {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const downloadButtons = document.getElementById('downloadButtons');

            try {
                const apiUrl = `${ASITHA_ENDPOINT}?apiKey=${ASITHA_API_KEY}&url=${encodeURIComponent(urlInput)}&fo=1&qu=720`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();

                loading.style.display = 'none';

                if (data && (data.dl_url || data.result || data.url || data.download)) {
                    const downloadUrl = data.dl_url || data.result?.dl_url || data.result || data.url || data.download;
                    const title = data.title || data.result?.title || "YouTube Video";
                    const thumbnail = data.thumbnail || data.result?.thumbnail || data.cover || "/New%20logo.jpg";
                    const titleClean = title.replace(/[^a-zA-Z0-9]/g, "_").substring(0, 25);

                    document.getElementById('coverImg').src = thumbnail;
                    document.getElementById('videoTitle').innerText = title;

                    downloadButtons.innerHTML = `
                        <button class="dl-btn dl-1080" onclick="downloadFile('${downloadUrl}', '${titleClean}_720p.mp4')">Download Video (720p HD)</button>
                        <button class="dl-btn dl-mp3" onclick="downloadFile('${downloadUrl}', '${titleClean}.mp3')">Download Audio (MP3)</button>
                    `;

                    result.style.display = 'block';
                } else {
                    showError("Failed to fetch YouTube video. Please check your link or API limit!");
                }
            } catch (err) {
                loading.style.display = 'none';
                showError("Error connecting to YouTube API server!");
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
        }

        // Direct Download Handler
        async function downloadFile(fileUrl, fileName) {
            if (!fileUrl) return;

            const loading = document.getElementById('loading');
            loading.innerText = "Downloading file directly to your device...";
            loading.style.display = 'block';

            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();

                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                const link = document.createElement('a');
                link.href = fileUrl;
                link.download = fileName;
                link.target = '_self';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
