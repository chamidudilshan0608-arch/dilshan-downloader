<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DILSHAN MEDIA DOWNLOADER</title>
    
    <!-- Logo & Favicon Links -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    
    <!-- Meta & SEO Tags -->
    <meta name="description" content="Download TikTok & Media videos without watermark in HD quality & MP3 audio for free with Dilshan Media Downloader.">
    <meta property="og:title" content="DILSHAN MEDIA DOWNLOADER">
    <meta property="og:description" content="Free HD Video & Audio Downloader">
    <meta property="og:image" content="/logo.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .logo-img {
            width: 85px;
            height: 85px;
            border-radius: 18px;
            margin-bottom: 15px;
            object-fit: cover;
        }
        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #00f2fe;
        }
        button.btn-search {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1f6feb, #00f2fe);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button.btn-search:hover {
            opacity: 0.9;
        }
        #loading {
            display: none;
            margin: 20px 0;
            color: #58a6ff;
            font-size: 14px;
        }
        #result {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
            text-align: left;
        }
        .cover-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .video-title {
            font-size: 14px;
            color: #e6edf3;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .section-label {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 10px;
        }
        .download-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .dl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .dl-1080 { background-color: #238636; }
        .dl-720 { background-color: #1f6feb; }
        .dl-mp3 { background-color: #8957e5; }
        .dl-btn:hover { opacity: 0.85; }
        
        .error-msg {
            color: #f85149;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Site Logo -->
        <img src="/logo.png" alt="DILSHAN MEDIA DOWNLOADER Logo" class="logo-img" onerror="this.style.display='none'">
        
        <!-- Header -->
        <h1>DILSHAN MEDIA DOWNLOADER</h1>
        <p class="subtitle">Download TikTok & Social Media Videos without Watermark in HD</p>

        <!-- Input Box & Button -->
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste Video Link Here...">
            <button class="btn-search" onclick="fetchVideo()">Download Now</button>
        </div>

        <!-- Error Alert -->
        <div id="errorMsg" class="error-msg"></div>

        <!-- Loading Indicator -->
        <div id="loading">Processing... Please wait...</div>

        <!-- Download Results Container -->
        <div id="result">
            <img id="coverImg" class="cover-img" src="" alt="Video Thumbnail">
            <div id="videoTitle" class="video-title"></div>

            <div class="section-label">Download Options:</div>
            <div class="download-options">
                <a id="dlNoWm" class="dl-btn dl-1080" href="#" target="_blank">Download HD (No Watermark)</a>
                <a id="dlWm" class="dl-btn dl-720" href="#" target="_blank">Download Watermark Video</a>
                <a id="dlMp3" class="dl-btn dl-mp3" href="#" target="_blank">Download Audio (MP3)</a>
            </div>
        </div>

        <footer>
            &copy; DILSHAN MEDIA DOWNLOADER - All Rights Reserved.
        </footer>
    </div>

    <script>
        async function fetchVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';
            result.style.display = 'none';

            if (!urlInput) {
                errorMsg.innerText = "Please paste a valid video URL!";
                errorMsg.style.display = 'block';
                return;
            }

            loading.style.display = 'block';

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();

                loading.style.display = 'none';

                if (data && data.data) {
                    document.getElementById('coverImg').src = data.data.cover;
                    document.getElementById('videoTitle').innerText = data.data.title || "Video";
                    
                    document.getElementById('dlNoWm').href = data.data.play;
                    document.getElementById('dlWm').href = data.data.wmplay || data.data.play;
                    document.getElementById('dlMp3').href = data.data.music;

                    result.style.display = 'block';
                } else {
                    errorMsg.innerText = "Failed to fetch video. Please check the link!";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                loading.style.display = 'none';
                errorMsg.innerText = "An error occurred while downloading!";
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
